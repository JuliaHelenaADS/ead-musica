    <h1>Formulário de Inscrição</h1>
    <form method="get" action="https://escola.ifrs.edu/cadastro.php">
        <label for="name">Nome completo:</label><br>
        <input type="text" id="name" name="name" placeholder="Seu nome" required><br>
        <br>
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Seu e-mail" required><br>
        <br>
        <label for="data">Data de nascimento:</label><br>
        <input type="date" id="data" name="data" required><br>
        <br>
        <label for="curso">Curso desejado:</label><br>
        <select id="curso" name="curso" required>
            <option value="V">Violão</option>
            <option value="P">Piano</option>
            <option value="B">Bateria</option>
        </select><br>
        <br>
        <label for="horario">Horário preferido:</label><br>
        <input type="radio" id="manha" name="horario"><label for="manha" required>Manhã</label>
        <input type="radio" id="tarde" name="horario"><label for="tarde">Tarde</label>
        <input type="radio" id="noite" name="horario"><label for="noite">Noite</label>
        <br>
        <br>
        <input type="submit" id="enviar" name="enviar" value="Enviar">
        <input type="reset" id="limpar" name="limpar" value="Limpar">
    </form>
</body>

</html>
